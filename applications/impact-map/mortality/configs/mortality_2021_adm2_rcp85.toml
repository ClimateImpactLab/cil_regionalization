# Production run: mortality physical effect (deaths/year), ADM2, rcp85.
#
# Tree: the complete 2021 Monte Carlo generation, restored from S3.
# The value is the levels file (deaths/year) minus its histclim
# sibling, differenced per leaf by tree.subtract_filename. Batches
# 0-14; batch15 is a later partial run without levels files and stays
# out. All SSPs the tree holds under this rcp are run; statistics come
# out per ssp because ssp is an identity dimension.
# The four excluded cells are the SSP5 leafdirs the sweep found
# incomplete; rcp45 has none.
#
# Statistics weight climate models by the SMME weights, matching the
# published tables. ADM0 comes from regrouping the adm1 reduced frame
# by ISO (exact for an extensive variable; verified to 2e-16), which
# is why the adm1 runs keep the reduced frame.

[weights]
dir = "/project/cil/home_dirs/scadavidsanchez/repos/climate-and-damages-aggregations/data/weights/ir_adm2_full"
weight = "pop"

[tree]
root = "/project/cil/battuta-shares-S3-archive/gcp/outputs/mortality/impacts-darwin/montecarlo"
levels = ["batch", "rcp", "gcm", "iam", "ssp"]
filename = "Agespec_interaction_response-combined-levels.nc4"
subtract_filename = "Agespec_interaction_response-combined-histclim-levels.nc4"
exclude = [
    ["batch8", "rcp85", "surrogate_MRI-CGCM3_11", "low", "SSP5"],
    ["batch9", "rcp85", "surrogate_MRI-CGCM3_06", "low", "SSP5"],
    ["batch9", "rcp85", "surrogate_MRI-CGCM3_11", "high", "SSP5"],
    ["batch9", "rcp85", "surrogate_MRI-CGCM3_11", "low", "SSP5"],
]

[tree.expect]
batch = ["batch0", "batch1", "batch2", "batch3", "batch4", "batch5", "batch6", "batch7", "batch8", "batch9", "batch10", "batch11", "batch12", "batch13", "batch14"]
rcp = ["rcp85"]
gcm = [
    "ACCESS1-0",
    "BNU-ESM",
    "CCSM4",
    "CESM1-BGC",
    "CNRM-CM5",
    "CSIRO-Mk3-6-0",
    "CanESM2",
    "GFDL-CM3",
    "GFDL-ESM2G",
    "GFDL-ESM2M",
    "IPSL-CM5A-LR",
    "IPSL-CM5A-MR",
    "MIROC-ESM",
    "MIROC-ESM-CHEM",
    "MIROC5",
    "MPI-ESM-LR",
    "MPI-ESM-MR",
    "MRI-CGCM3",
    "NorESM1-M",
    "bcc-csm1-1",
    "inmcm4",
    "surrogate_CanESM2_89",
    "surrogate_CanESM2_94",
    "surrogate_CanESM2_99",
    "surrogate_GFDL-CM3_89",
    "surrogate_GFDL-CM3_94",
    "surrogate_GFDL-CM3_99",
    "surrogate_GFDL-ESM2G_01",
    "surrogate_GFDL-ESM2G_06",
    "surrogate_GFDL-ESM2G_11",
    "surrogate_MRI-CGCM3_01",
    "surrogate_MRI-CGCM3_06",
    "surrogate_MRI-CGCM3_11",
]
iam = ["high", "low"]
ssp = ["SSP2", "SSP3", "SSP4", "SSP5"]

[data]
format = "netcdf"
region_dim = "region"
region_labels = "regions"
value_col = "rebased"
kind = "extensive"
version = "world-combo-201710"

[stats]
sample_dims = ["batch", "gcm"]
time_col = "year"
windows = [[2020, 2039], [2040, 2059], [2080, 2099]]
quantiles = [0.05, 0.17, 0.25, 0.5, 0.75, 0.83, 0.95]
include_mean = true
model_weights = "/project/cil/gcp/climate/SMME-weights/rcp85_SMME_weights.tsv"
model_weight_level = "gcm"

[output]
dir = "/project/cil/gcp/impact_map/mortality/adm2"
stem = "mortality_physical_rcp85"
write_leaves = false
write_reduced = false

[run]
n_workers = 16
