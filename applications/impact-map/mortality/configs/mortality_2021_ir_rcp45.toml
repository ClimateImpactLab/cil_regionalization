# Impact region run: mortality physical effect (deaths/year), rcp45.
#
# The same statistics as the aggregated products, one step earlier:
# there is no [weights] section, so the pipeline runs in passthrough
# and the rows stay keyed by hierid, the tree's own regions. The tree
# and every declaration under [tree] match mortality_2021_adm2_rcp45.toml
# exactly; the value is the levels file minus its histclim sibling,
# differenced per leaf by tree.subtract_filename.
#
# Windows: the aggregated three plus the final projection year (2099)
# on its own, labeled "2099", matching the end-year figures the
# published maps show. Statistics weight climate models by the SMME
# weights, as everywhere else.

[tree]
root = "/project/cil/battuta-shares-S3-archive/gcp/outputs/mortality/impacts-darwin/montecarlo"
levels = ["batch", "rcp", "gcm", "iam", "ssp"]
filename = "Agespec_interaction_response-combined-levels.nc4"
subtract_filename = "Agespec_interaction_response-combined-histclim-levels.nc4"

[tree.expect]
batch = ["batch0", "batch1", "batch2", "batch3", "batch4", "batch5", "batch6", "batch7", "batch8", "batch9", "batch10", "batch11", "batch12", "batch13", "batch14"]
rcp = ["rcp45"]
gcm = [
    "ACCESS1-0",
    "BNU-ESM",
    "CCSM4",
    "CESM1-BGC",
    "CNRM-CM5",
    "CSIRO-Mk3-6-0",
    "CanESM2",
    "GFDL-CM3",
    "GFDL-ESM2G",
    "GFDL-ESM2M",
    "IPSL-CM5A-LR",
    "IPSL-CM5A-MR",
    "MIROC-ESM",
    "MIROC-ESM-CHEM",
    "MIROC5",
    "MPI-ESM-LR",
    "MPI-ESM-MR",
    "MRI-CGCM3",
    "NorESM1-M",
    "bcc-csm1-1",
    "inmcm4",
    "surrogate_CanESM2_89",
    "surrogate_CanESM2_94",
    "surrogate_CanESM2_99",
    "surrogate_GFDL-CM3_89",
    "surrogate_GFDL-CM3_94",
    "surrogate_GFDL-CM3_99",
    "surrogate_GFDL-ESM2G_01",
    "surrogate_GFDL-ESM2G_11",
    "surrogate_MRI-CGCM3_01",
    "surrogate_MRI-CGCM3_06",
    "surrogate_MRI-CGCM3_11",
]
iam = ["high", "low"]
ssp = ["SSP1", "SSP2", "SSP3", "SSP4"]

[data]
format = "netcdf"
region_dim = "region"
region_labels = "regions"
region_col = "hierid"
value_col = "rebased"
kind = "extensive"
version = "world-combo-201710"

[stats]
sample_dims = ["batch", "gcm"]
time_col = "year"
windows = [[2020, 2039], [2040, 2059], [2080, 2099], [2099, 2099]]
quantiles = [0.05, 0.17, 0.25, 0.5, 0.75, 0.83, 0.95]
include_mean = true
model_weights = "/project/cil/gcp/climate/SMME-weights/rcp45_SMME_weights.tsv"
model_weight_level = "gcm"

[output]
dir = "/project/cil/gcp/impact_map/impact_region/mortality"
stem = "mortality_physical_rcp45"
write_leaves = false
write_reduced = false

[run]
n_workers = 16
