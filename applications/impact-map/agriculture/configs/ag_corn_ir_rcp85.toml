# Impact region run: corn physical effect (log kg/Ha, full
# adaptation minus histclim), rcp85.
#
# Passthrough: no [weights] section and no crop-area weighting, rows
# keyed by hierid. Regions with no corn cropland, absent from the
# aggregated products, appear here; every crop covers the same region
# set at this level. The tree and every declaration under [tree] match
# ag_corn_adm2_rcp85.toml exactly. Windows: the aggregated three plus
# the final projection year (2098) on its own, labeled "2098" (the
# NEX-GDDP climate input lacks precipitation for some models after
# 2098).

[tree]
root = "/project/cil/gcp/outputs/agriculture/impacts-mealy/montecarlo/corn-2025_1pct_winsorization/montecarlo"
levels = ["batch", "rcp", "gcm", "iam", "ssp"]
filename = "corn-160221.nc4"
subtract_filename = "corn-160221-histclim.nc4"

[tree.expect]
batch = ["batch0", "batch1", "batch2", "batch3", "batch4", "batch5", "batch6", "batch7", "batch8", "batch9", "batch10", "batch11", "batch12", "batch13", "batch14"]
rcp = ["rcp85"]
gcm = [
    "BNU-ESM",
    "CCSM4",
    "CESM1-BGC",
    "CNRM-CM5",
    "CSIRO-Mk3-6-0",
    "CanESM2",
    "GFDL-CM3",
    "GFDL-ESM2G",
    "GFDL-ESM2M",
    "IPSL-CM5A-LR",
    "IPSL-CM5A-MR",
    "MIROC-ESM",
    "MIROC-ESM-CHEM",
    "MIROC5",
    "MPI-ESM-LR",
    "MPI-ESM-MR",
    "MRI-CGCM3",
    "NorESM1-M",
    "bcc-csm1-1",
    "inmcm4",
    "surrogate_CanESM2_89",
    "surrogate_CanESM2_94",
    "surrogate_CanESM2_99",
    "surrogate_GFDL-CM3_89",
    "surrogate_GFDL-CM3_94",
    "surrogate_GFDL-CM3_99",
    "surrogate_GFDL-ESM2G_01",
    "surrogate_GFDL-ESM2G_06",
    "surrogate_GFDL-ESM2G_11",
    "surrogate_MRI-CGCM3_01",
    "surrogate_MRI-CGCM3_06",
    "surrogate_MRI-CGCM3_11",
]
iam = ["high", "low"]
ssp = ["SSP2", "SSP3", "SSP4"]

[data]
format = "netcdf"
region_dim = "region"
region_labels = "regions"
region_col = "hierid"
value_col = "rebased"
kind = "intensive"
version = "world-combo-201710"

[stats]
sample_dims = ["batch", "gcm"]
time_col = "year"
windows = [[2020, 2039], [2040, 2059], [2080, 2098], [2098, 2098]]
quantiles = [0.05, 0.17, 0.25, 0.5, 0.75, 0.83, 0.95]
include_mean = true
model_weights = "/project/cil/home_dirs/scadavidsanchez/repos/cil_regionalization/examples/montecarlo/runs/rcp85_SMME_weights_agriculture.tsv"
model_weight_level = "gcm"

[output]
dir = "/project/cil/gcp/impact_map/impact_region/agriculture/corn"
stem = "corn_physical_log_rcp85"
write_leaves = false
write_reduced = false

[run]
n_workers = 16
