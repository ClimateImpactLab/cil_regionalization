[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cil_regionalization"
version = "0.5.0"
description = "Config-driven segment weights mapping climate grid cells to regions, with local and BigQuery backends producing identical schemas."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Climate Impact Lab" },
]
dependencies = [
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "exactextract>=0.2",
    "rasterio>=1.3",
    "pyarrow>=14",
    "pydantic>=2.6",
    # 2.1: before it a grouped sum or mean of an infinity is NaN
    "pandas>=2.1",
    "numpy>=1.24",
    "scipy>=1.10",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
bigquery = [
    "google-cloud-bigquery>=3.13",
    "google-cloud-bigquery-storage>=2.24",
    "db-dtypes>=1.2",
    "gcsfs>=2024.2.0",
]
dask = [
    "dask[distributed]>=2024.1.0",
    "dask-jobqueue>=0.8",
]
netcdf = [
    "xarray>=2023.1",
    "netcdf4>=1.6.0",
]
# what the example notebooks need: the NetCDF readers plus jupyter
# and matplotlib
examples = [
    "cil_regionalization[netcdf]",
    "jupyter>=1.0",
    "matplotlib>=3.7",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
]

[project.urls]
Repository = "https://github.com/ClimateImpactLab/cil_regionalization"
"Impact regions (Zenodo)" = "https://doi.org/10.5281/zenodo.21934131"
"Weights, GADM 2.0 (Zenodo)" = "https://doi.org/10.5281/zenodo.21934155"
"Weights, GADM 4.1 (Zenodo)" = "https://doi.org/10.5281/zenodo.21935431"
"SMME model weights (Zenodo)" = "https://doi.org/10.5281/zenodo.22003542"

[project.scripts]
cilreg = "cil_regionalization.cli:main"

[tool.setuptools.packages.find]
include = ["cil_regionalization*"]
exclude = ["tests*", "refs*", "scratch*", "data*"]

[tool.setuptools.package-data]
cil_regionalization = ["registry.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "bigquery: tests that contact BigQuery; require credentials and cilresearch context",
    "dask: tests that spin up a real Dask LocalCluster; skipped by default to keep the suite fast",
    "network: tests that reach the internet; excluded by default so the suite runs offline",
    "benchmark: timing runs under benchmarks/; excluded by default, they assert identical output and print timings",
]
addopts = "-ra --strict-markers -m 'not bigquery and not dask and not network and not benchmark'"

# CI runs `ruff check` and `ruff format --check` with the version it
# pins. The rules are syntax errors, misplaced and unused imports, and
# pyflakes: what can be wrong, not what is a matter of taste.
[tool.ruff]
target-version = "py310"
line-length = 88
# notebooks are documents with their outputs, and are left as written
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# the package repairs the environment before it imports anything
"cil_regionalization/__init__.py" = ["E402"]
# tests import after pytest.importorskip, and scripts after setting sys.path
"tests/**" = ["E402"]
"examples/**" = ["E402"]
# fixtures imported from another test module are redefined as arguments
"tests/integration/test_xarray_parity.py" = ["F811"]
