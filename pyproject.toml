[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cil_regionalization"
version = "0.1.0"
description = "Config-driven segment weights mapping climate grid cells to regions, with local and BigQuery backends producing identical schemas."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Climate Impact Lab" },
]
dependencies = [
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "exactextract>=0.2",
    "rasterio>=1.3",
    "pyarrow>=14",
    "pydantic>=2.6",
    "pandas>=2.0",
    "numpy>=1.24",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
bigquery = [
    "google-cloud-bigquery>=3.13",
    "google-cloud-bigquery-storage>=2.24",
    "db-dtypes>=1.2",
    "gcsfs>=2024.2.0",
]
dask = [
    "dask[distributed]>=2024.1.0",
    "dask-jobqueue>=0.8",
]
netcdf = [
    "xarray>=2023.1",
    "netcdf4>=1.6.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
]

[project.urls]
Repository = "https://github.com/ClimateImpactLab/cil_regionalization"
"Impact regions (Zenodo)" = "https://doi.org/10.5281/zenodo.21934131"
"Weights, GADM 2.0 (Zenodo)" = "https://doi.org/10.5281/zenodo.21934155"
"Weights, GADM 4.1 (Zenodo)" = "https://doi.org/10.5281/zenodo.21935431"
"SMME model weights (Zenodo)" = "https://doi.org/10.5281/zenodo.22003542"

[project.scripts]
cilreg = "cil_regionalization.cli:main"

[tool.setuptools.packages.find]
include = ["cil_regionalization*"]
exclude = ["tests*", "refs*", "scratch*", "data*"]

[tool.setuptools.package-data]
cil_regionalization = ["registry.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "bigquery: tests that contact BigQuery; require credentials and cilresearch context",
    "dask: tests that spin up a real Dask LocalCluster; skipped by default to keep the suite fast",
]
addopts = "-ra --strict-markers -m 'not bigquery and not dask'"
