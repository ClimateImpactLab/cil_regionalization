<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-label="Flow from geometries and rasters through weight generation to published weight files, then application to impact region draws and statistics to administrative level results.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#3d4451"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#33628f"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="430" fill="#ffffff"/>

  <!-- lane panels -->
  <rect x="16" y="16" width="968" height="190" rx="10" fill="#f4f5f7"/>
  <rect x="16" y="224" width="968" height="190" rx="10" fill="#f4f5f7"/>
  <text x="34" y="42" font-family="system-ui, 'Segoe UI', sans-serif" font-size="11" letter-spacing="1.6" fill="#6b7280">GENERATE, ONCE PER GEOMETRY PAIR</text>
  <text x="34" y="250" font-family="system-ui, 'Segoe UI', sans-serif" font-size="11" letter-spacing="1.6" fill="#6b7280">APPLY, EVERY ANALYSIS</text>

  <!-- lane 1: inputs -->
  <g font-family="system-ui, 'Segoe UI', sans-serif">
    <rect x="40" y="56" width="190" height="40" rx="7" fill="#ffffff" stroke="#9aa1ad" stroke-width="1.2"/>
    <text x="135" y="73" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2937">Target geometry</text>
    <text x="135" y="88" text-anchor="middle" font-size="10.5" fill="#4b5563">admin units, e.g. GADM</text>

    <rect x="40" y="106" width="190" height="40" rx="7" fill="#ffffff" stroke="#9aa1ad" stroke-width="1.2"/>
    <text x="135" y="123" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2937">Source geometry</text>
    <text x="135" y="138" text-anchor="middle" font-size="10.5" fill="#4b5563">impact regions</text>

    <rect x="40" y="156" width="190" height="40" rx="7" fill="#ffffff" stroke="#9aa1ad" stroke-width="1.2"/>
    <text x="135" y="173" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2937">Weighting rasters</text>
    <text x="135" y="188" text-anchor="middle" font-size="10.5" fill="#4b5563">population, area</text>

    <!-- generation -->
    <rect x="340" y="96" width="230" height="60" rx="7" fill="#ffffff" stroke="#3d4451" stroke-width="1.4"/>
    <text x="455" y="121" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Generate weights</text>
    <text x="455" y="138" text-anchor="middle" font-size="10.5" fill="#4b5563">intersect, weigh, normalize</text>

    <!-- artifact -->
    <rect x="700" y="88" width="220" height="76" rx="7" fill="#e8eff7" stroke="#33628f" stroke-width="1.5"/>
    <text x="810" y="112" text-anchor="middle" font-size="13" font-weight="600" fill="#1c3d5f">Weight files</text>
    <text x="810" y="129" text-anchor="middle" font-size="10.5" fill="#33507a">parquet + manifest with checksums</text>
    <text x="810" y="144" text-anchor="middle" font-size="10.5" fill="#33507a">per_source or per_destination</text>

    <!-- lane 1 arrows -->
    <line x1="230" y1="76" x2="334" y2="111" stroke="#3d4451" stroke-width="1.3" marker-end="url(#arrow)"/>
    <line x1="230" y1="126" x2="334" y2="126" stroke="#3d4451" stroke-width="1.3" marker-end="url(#arrow)"/>
    <line x1="230" y1="176" x2="334" y2="141" stroke="#3d4451" stroke-width="1.3" marker-end="url(#arrow)"/>
    <line x1="570" y1="126" x2="694" y2="126" stroke="#3d4451" stroke-width="1.3" marker-end="url(#arrow)"/>
    <text x="632" y="117" text-anchor="middle" font-size="10.5" fill="#4b5563">shares sum to 1</text>
  </g>

  <!-- artifact drop into lane 2 -->
  <path d="M 810 164 L 810 215 L 445 215 L 445 276" fill="none" stroke="#33628f" stroke-width="1.5" marker-end="url(#arrowAccent)"/>
  <text x="628" y="209" text-anchor="middle" font-family="system-ui, 'Segoe UI', sans-serif" font-size="10.5" fill="#33628f">published on Zenodo; fetched, checksum verified, cached</text>

  <!-- lane 2 -->
  <g font-family="system-ui, 'Segoe UI', sans-serif">
    <rect x="40" y="290" width="190" height="56" rx="7" fill="#ffffff" stroke="#9aa1ad" stroke-width="1.2"/>
    <text x="135" y="313" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2937">Impact region draws</text>
    <text x="135" y="329" text-anchor="middle" font-size="10.5" fill="#4b5563">Monte Carlo output</text>

    <rect x="330" y="280" width="230" height="76" rx="7" fill="#ffffff" stroke="#3d4451" stroke-width="1.4"/>
    <text x="445" y="303" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Apply weights</text>
    <text x="445" y="321" text-anchor="middle" font-size="10.5" fill="#4b5563">extensive: weighted sum</text>
    <text x="445" y="336" text-anchor="middle" font-size="10.5" fill="#4b5563">intensive: weighted mean</text>

    <rect x="640" y="290" width="170" height="56" rx="7" fill="#ffffff" stroke="#3d4451" stroke-width="1.4"/>
    <text x="725" y="313" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Statistics</text>
    <text x="725" y="329" text-anchor="middle" font-size="10.5" fill="#4b5563">window mean, then pool</text>

    <rect x="860" y="290" width="106" height="56" rx="7" fill="#ffffff" stroke="#9aa1ad" stroke-width="1.2"/>
    <text x="913" y="313" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2937">Results</text>
    <text x="913" y="329" text-anchor="middle" font-size="10.5" fill="#4b5563">mean, quantiles</text>

    <!-- lane 2 arrows -->
    <line x1="230" y1="318" x2="324" y2="318" stroke="#3d4451" stroke-width="1.3" marker-end="url(#arrow)"/>
    <line x1="560" y1="318" x2="634" y2="318" stroke="#3d4451" stroke-width="1.3" marker-end="url(#arrow)"/>
    <line x1="810" y1="318" x2="854" y2="318" stroke="#3d4451" stroke-width="1.3" marker-end="url(#arrow)"/>
  </g>
</svg>
