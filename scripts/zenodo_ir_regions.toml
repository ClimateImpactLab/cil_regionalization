# Zenodo record definition for the impact region shapefile.
# Consumed by scripts/publish_zenodo.py; see its docstring for usage.
# Publish this record first: the weight records reference its DOI.
# The description and zip README name the cil_regionalization package
# and the Climate Impact Lab GitHub organisation: at the repository
# move, check these against the final names. Published record
# descriptions are editable on Zenodo without creating a new version.

files_dir = "data/zenodo_upload/ir_regions"
title = "Climate Impact Lab impact regions, world-combo-201710"
version = "1.0.0"
keywords = [
    "climate impacts",
    "impact regions",
    "spatial aggregation",
    "region boundaries",
    "shapefile",
]

description = """
The Climate Impact Lab impact region boundaries, version world-combo-201710: 24,378 regions covering global land, built by agglomerating administrative units into regions of comparable population.

Three things the file does not say itself: there is no .prj, and coordinates are longitude and latitude on WGS84 (EPSG:4326); the identifying attribute is hierid; hierid is an opaque key whose apparent structure varies across regions and should not be parsed.

Unzip and read like any shapefile. The cil_regionalization package (Climate Impact Lab GitHub organisation) uses it as the source geometry for weight generation.
"""

files = [
    "agglomerated-world-new.shp",
    "agglomerated-world-new.shx",
    "agglomerated-world-new.dbf",
]

# The shapefile components are useless individually; publish the zip only.
loose = false

[zip]
name = "world-combo-201710_impact_regions.zip"
readme = """
Climate Impact Lab impact regions, version world-combo-201710:
24,378 regions covering global land. No .prj is included; coordinates
are longitude and latitude on WGS84 (EPSG:4326). The identifying
attribute is hierid, an opaque key not to be parsed.
"""
