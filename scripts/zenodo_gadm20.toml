# Zenodo record definition for the GADM 2.0 weight files.
# Consumed by scripts/publish_zenodo.py; see its docstring for usage.
# The description and zip README name the cil_regionalization package
# and the Climate Impact Lab GitHub organisation: at the repository
# move, check these against the final names. Published record
# descriptions are editable on Zenodo without creating a new version.

files_dir = "data/zenodo_upload/gadm20"
title = "Impact region to GADM 2.0 administrative unit aggregation weights"
version = "1.0.0"
keywords = [
    "climate impacts",
    "spatial aggregation",
    "impact regions",
    "GADM",
    "administrative boundaries",
    "population weights",
    "area weights",
]

description = """
Weights for aggregating Climate Impact Lab impact region results to GADM 2.0 administrative units, at ADM1 (state or province) and ADM2 (district) level.

Each level comes in two directions, and the choice matters. The per_source files split a region's total between the units it touches (shares sum to one per region); use them for totals like dollars or deaths. The per_destination files average over the regions inside each unit (shares sum to one per unit); use them for averages like rates or temperatures. One direction cannot do the other's job, and weights built on other GADM vintages are not comparable with these.

Each artifact is a parquet table plus a manifest carrying provenance and a SHA256 checksum of the parquet. Source geometry: world-combo-201710, 24,378 impact regions. Target: GADM 2.0, vintage label gadm-2.0-impactmap-copy-2025, population weights from GPW v4r10 (2015).

With the cil_regionalization package (Climate Impact Lab GitHub organisation): fetch_weights("gadm20-adm1-per-source"), and likewise for the other three names.
"""

# Registry name to file stem; also defines the expected staged files.
[registry_names]
gadm20-adm1-per-source = "ir_adm1_per_source"
gadm20-adm1-per-destination = "ir_adm1_per_destination"
gadm20-adm2-per-source = "ir_adm2_per_source"
gadm20-adm2-per-destination = "ir_adm2_per_destination"

# The browsable zip built at upload time alongside the loose files.
[zip]
name = "gadm20_aggregation_weights.zip"
readme = """
Impact region to GADM 2.0 aggregation weights. Each folder holds one
weight file pair: weights.parquet and weights.manifest.json (provenance
plus a SHA256 of the parquet). The folder name is the name the
cil_regionalization package fetches it by.

per_source folders split a region's total between the units it touches:
use for totals (dollars, deaths). per_destination folders average over
the regions inside each unit: use for averages (rates, temperatures).
adm1 is state or province level, adm2 is district level, on GADM 2.0.
"""

# Fill in after the impact region shapefile record exists, then
# republish metadata (new version or edit in the browser).
[[related_identifiers]]
identifier = "10.5281/zenodo.21934131"
relation = "isDerivedFrom"
