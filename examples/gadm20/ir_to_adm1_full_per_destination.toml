# Full global IR to ADM1 mean weights (per_destination).
#
# The configuration that produced data/weights/ir_adm1_full_per_destination (run
# serially; 692 seconds and 2.1 GB peak on the first production run).
# Both area and pop weights are carried so the allocation choice stays
# comparable without regenerating geometry. on_zero_overlap stays
# "skip" so a source unit overlapping no target in a global run is
# reported with the completed outputs rather than discarding the whole
# computation; the first global run recorded zero such units, zero
# empty targets, and zero partial coverage.

normalization = "per_destination"

[project]
name = "ir_adm1_full_per_destination"
description = "IR to GADM 2.0 ADM1 allocation weights, full global run"

[regions]
path = "../../data/targets/gadm20/adm1.parquet"
id_fields = ["ISO", "ID_1"]
version = "gadm-2.0-impactmap-copy-2025"


[source]
path = "/project/cil/gcp/regions/world-combo-201710/agglomerated-world-new.shp"
id_fields = ["hierid"]
version = "world-combo-201710"
on_invalid_geometry = "repair"
on_zero_overlap = "skip"

[[weights]]
name = "pop"
raster = "/project/cil/gcp/social/population/gpw_v4r10_unwpp_2015/raster_geotiff/gpw_v4r10_unwpp_2015_30ss.tif"
fallback = "area"

[[weights]]
name = "area"

[backend]
kind = "local"
coverage = "exact_fraction"

[output]
dir = "../../data/weights/ir_adm1_full_per_destination"
format = "parquet"

[validation]
sum_tolerance = 1e-6
