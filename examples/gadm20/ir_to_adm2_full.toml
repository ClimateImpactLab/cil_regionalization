# Full global IR to ADM2 allocation weights.
#
# The configuration that produced data/weights/ir_adm2_full (run
# serially; 893 seconds and 2.3 GB peak on the first full run,
# strongly sublinear against the 12.5 fold larger target count). See
# ir_to_adm1_full.toml for the shared policy choices.

normalization = "per_source"

[project]
name = "ir_adm2_full"
description = "IR to GADM 2.0 ADM2 allocation weights, full global run"

[regions]
# Not distributed (GADM restricts redistribution). Create this file
# first with examples/gadm20/prepare_gadm20_targets.py --source
# <your GADM file>; it writes here by default.
path = "../../data/targets/gadm20/adm2.parquet"
id_fields = ["ISO", "ID_1", "ID_2"]
version = "gadm-2.0-impactmap-copy-2025"


[source]
# The impact region shapefile, published at 10.5281/zenodo.21934131.
# The path is the cluster location used for the published runs; replace
# it with the path to your copy.
path = "/project/cil/gcp/regions/world-combo-201710/agglomerated-world-new.shp"
id_fields = ["hierid"]
version = "world-combo-201710"
on_invalid_geometry = "repair"
on_zero_overlap = "skip"

[[weights]]
name = "pop"
# GPW v4 rev 10 population raster (2015, 30 arc second), from SEDAC.
# The path is the cluster location used for the published runs; replace
# it with the path to your copy.
raster = "/project/cil/gcp/social/population/gpw_v4r10_unwpp_2015/raster_geotiff/gpw_v4r10_unwpp_2015_30ss.tif"
fallback = "area"

[[weights]]
name = "area"

[backend]
kind = "local"
coverage = "exact_fraction"

[output]
dir = "../../data/weights/ir_adm2_full"
format = "parquet"

[validation]
sum_tolerance = 1e-6
