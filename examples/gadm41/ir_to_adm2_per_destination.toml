# Full global IR to GADM 4.1 adm2 weights, per_destination.
#
# Parallel to the GADM 2.0 configuration of the same direction. Weights
# built on GADM 4.1 are not interchangeable with weights built on GADM
# 2.0: different unit universes, different keys, and results built on
# one cannot be compared with results built on the other.

normalization = "per_destination"

[project]
name = "gadm41_adm2_per_destination"
description = "IR to GADM 4.1 adm2 weights, per_destination; not interchangeable with GADM 2.0 weights (different unit universes and keys)"

[regions]
path = "../../data/targets/gadm41/adm2.parquet"
id_fields = ["GID_0", "GID_1", "GID_2"]
version = "gadm-4.10-impactmap-copy-2022"

[source]
path = "/project/cil/gcp/regions/world-combo-201710/agglomerated-world-new.shp"
id_fields = ["hierid"]
version = "world-combo-201710"
on_invalid_geometry = "repair"
on_zero_overlap = "skip"

[[weights]]
name = "pop"
raster = "/project/cil/gcp/social/population/gpw_v4r10_unwpp_2015/raster_geotiff/gpw_v4r10_unwpp_2015_30ss.tif"
fallback = "area"

[[weights]]
name = "area"

[backend]
kind = "local"
coverage = "exact_fraction"

[output]
dir = "../../data/weights/gadm41_adm2_per_destination"
format = "parquet"

[validation]
sum_tolerance = 1e-6
