# Production run: labor valued effect (wage value of lost minutes,
# 2005 PPP USD), ADM1, rcp85.
#
# Tree: the 2025 uninteracted_main_model generation, the published
# 2020 labor model, 15 batches, histclim on every leaf (swept
# complete). The value is the -wage-levels file minus its histclim
# sibling, differenced per leaf by tree.subtract_filename. The raw
# unit is 2005 PPP USD.
#
# Statistics weight climate models by the SMME weights. ADM0 comes
# from regrouping the adm1 reduced frame by ISO, which is why the
# adm1 runs keep it. The physical product (minutes per worker per
# day) does not run through the pipeline: the ratio route needs a
# population denominator no leaf carries; run_physical_labor.py next
# to this config does that.

[weights]
dir = "/project/cil/home_dirs/scadavidsanchez/repos/climate-and-damages-aggregations/data/weights/ir_adm1_full"
weight = "pop"

[tree]
root = "/project/cil/gcp/outputs/labor/impacts-woodwork/montecarlo/uninteracted_main_model_27_37_39"
levels = ["batch", "rcp", "gcm", "iam", "ssp"]
filename = "uninteracted_main_model-wage-levels.nc4"
subtract_filename = "uninteracted_main_model-histclim-wage-levels.nc4"

[tree.expect]
batch = ["batch0", "batch1", "batch2", "batch3", "batch4", "batch5", "batch6", "batch7", "batch8", "batch9", "batch10", "batch11", "batch12", "batch13", "batch14"]
rcp = ["rcp85"]
gcm = [
    "ACCESS1-0",
    "BNU-ESM",
    "CCSM4",
    "CESM1-BGC",
    "CNRM-CM5",
    "CSIRO-Mk3-6-0",
    "CanESM2",
    "GFDL-CM3",
    "GFDL-ESM2G",
    "GFDL-ESM2M",
    "IPSL-CM5A-LR",
    "IPSL-CM5A-MR",
    "MIROC-ESM",
    "MIROC-ESM-CHEM",
    "MIROC5",
    "MPI-ESM-LR",
    "MPI-ESM-MR",
    "MRI-CGCM3",
    "NorESM1-M",
    "bcc-csm1-1",
    "inmcm4",
    "surrogate_CanESM2_89",
    "surrogate_CanESM2_94",
    "surrogate_CanESM2_99",
    "surrogate_GFDL-CM3_89",
    "surrogate_GFDL-CM3_94",
    "surrogate_GFDL-CM3_99",
    "surrogate_GFDL-ESM2G_01",
    "surrogate_GFDL-ESM2G_06",
    "surrogate_GFDL-ESM2G_11",
    "surrogate_MRI-CGCM3_01",
    "surrogate_MRI-CGCM3_06",
    "surrogate_MRI-CGCM3_11",
]
iam = ["high", "low"]
ssp = ["SSP2", "SSP3", "SSP4"]

[data]
format = "netcdf"
region_dim = "region"
region_labels = "regions"
value_col = "rebased"
kind = "extensive"
version = "world-combo-201710"

[stats]
sample_dims = ["batch", "gcm"]
time_col = "year"
windows = [[2020, 2039], [2040, 2059], [2080, 2099]]
quantiles = [0.05, 0.17, 0.25, 0.5, 0.75, 0.83, 0.95]
include_mean = true
model_weights = "/project/cil/gcp/climate/SMME-weights/rcp85_SMME_weights.tsv"
model_weight_level = "gcm"

[output]
dir = "/project/cil/gcp/impact_map/labor/adm1"
stem = "labor_valued_rcp85"
write_leaves = false
write_reduced = true

[run]
n_workers = 16
