# s51 full-scale config. s51 is the internal name of a specific weights
# deliverable: the full impact region by one degree grid run with area
# and population weights. The name is historical.
#
# Drives the production run: every IR region, area + pop, output to the
# canonical GCS scratch prefix. Not executed unless the runner is invoked
# with --full and you confirm the dry-run cost interactively.
#
# Run from anywhere (requires ADC on cilresearch):
#     python examples/s51/runner.py                 # test mode (default)
#     python examples/s51/runner.py --full          # full run (prompts)

[project]
name = "s51"
description = "s51 case: full IR x 1deg grid, area + pop"

[regions]
table = "compute-impactlab.spatial_aggregation.clustered_impactlab-world-combo-2017_geometries_20221012"
id_fields = ["hierid"]
# No keep filter: every IR region.
# The IR table has 17 hierids with geometry IS NULL inherited from the
# legacy pipeline's SAFE.ST_GEOGFROMTEXT silent-null behavior. "skip"
# excludes them, records them in the manifest under
# null_geometry_regions. The runner asserts
# output_regions + null_skipped + unknown_skipped == 24,378.
on_null_geometry = "skip"
# Full s51 has no keep filter, so unknown ids never apply here. Set
# explicit "skip" anyway so the policy is documented for any future
# config that copies from this one with a partial filter.
on_unknown_id = "skip"

[grid]
mode = "generate"
resolution = 1.0
offset = "center"
lon_convention = "[-180,180)"

[[weights]]
name = "pop"
table = "compute-impactlab.gridded_population_of_the_world.GPW_UN_WPP_Adjusted_Population_Count_2015_v4_10"
fallback = "area"

[[weights]]
name = "area"

[backend]
kind = "bigquery"
coverage = "pixel_centroid"

[backend.bigquery]
project = "compute-impactlab"
temp_dataset = "temp_workspace"
# 8 GB: measured 5,257,870,075 bytes (5.26 GB) on cilresearch for the
# full 24,361-valid-region dry-run (2026-06-10), plus ~50% margin for
# IR vintage growth and ST_INTERSECTION variability. The runner
# re-measures via dry_run() before every real query and refuses if the
# estimate exceeds this number; raise it explicitly in the config if a
# future vintage drives the cost up.
dry_run_byte_ceiling = 8_000_000_000
staging_uri = "gs://impactlab-data-scratch/scadavidsanchez/climate-and-damages-aggregation/staging/"
# Keep the geometry temp table around: identical re-runs (and the
# estimate->confirm->run sequence) skip the re-upload.
cache_temp_tables = true
use_bqstorage = false  # default; cilresearch lacks readSessionUser

[output]
dir = "gs://impactlab-data-scratch/scadavidsanchez/climate-and-damages-aggregation/segment_weights/s51/"
format = "parquet"
# True: the runner prints the dry-run estimate and exits non-zero until
# either confirm_cost is flipped to false in the config or --yes is
# passed on the command line. No stdin prompt, works under nbconvert,
# cron, and SLURM.
confirm_cost = true

[validation]
sum_tolerance = 1.0e-6
