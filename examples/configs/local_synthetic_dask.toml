# LocalCluster Dask smoke test.
#
# Same fixture as local_synthetic.toml, but routes the per-region segment
# build through a Dask LocalCluster. With three synthetic regions the
# parallelism is symbolic; the point is to exercise the code path on
# every workstation without a SLURM scheduler. For the real cluster
# variant see examples/configs/local_s51_dask_slurm.toml (not committed;
# see README in examples/rcc_crops once Stage 7 #7 lands).
#
# Run:
#     segweights validate examples/configs/local_synthetic_dask.toml
#     segweights run      examples/configs/local_synthetic_dask.toml --test-mode

[project]
name = "local_synthetic_dask_example"

[regions]
path = "../../tests/data/synthetic/regions.parquet"
id_fields = ["region_id"]

[grid]
mode = "generate"
resolution = 1.0
offset = "center"
lon_convention = "[-180,180)"

[[weights]]
name = "pop"
raster = "../../tests/data/synthetic/raster.tif"
fallback = "area"

[[weights]]
name = "area"

[backend]
kind = "local"
coverage = "exact_fraction"

[backend.local]
dask = "local"
n_workers = 2
threads_per_worker = 1

[output]
dir = "../../data/out/local_synthetic_dask"
format = "both"
