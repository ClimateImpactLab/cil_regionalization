# BigQuery backend smoke test config.
#
# Run from anywhere (requires ADC on cilresearch):
#     segweights validate examples/configs/bigquery_s51_test.toml
#     segweights run      examples/configs/bigquery_s51_test.toml --test-mode
#
# Five tiny hierids; under the 10 GB dry-run ceiling. The output Parquet
# lives under data/out/ (gitignored).

[project]
name = "bigquery_s51_test"

[regions]
table = "compute-impactlab.spatial_aggregation.clustered_impactlab-world-combo-2017_geometries_20221012"
id_fields = ["hierid"]
keep = { hierid = ["ABW", "AND", "BHR", "BMU", "MAF"] }

[grid]
mode = "generate"
resolution = 1.0
offset = "center"
lon_convention = "[-180,180)"

[[weights]]
name = "pop"
table = "compute-impactlab.gridded_population_of_the_world.GPW_UN_WPP_Adjusted_Population_Count_2015_v4_10"
fallback = "area"

[[weights]]
name = "area"

[backend]
kind = "bigquery"
coverage = "pixel_centroid"

[backend.bigquery]
project = "compute-impactlab"
# Confirmed on cilresearch: temp_workspace is the existing dataset in US.
# Never create a dataset; use what's there.
temp_dataset = "temp_workspace"
dry_run_byte_ceiling = 10_000_000_000  # 10 GB; admits one full GPW scan
# GCS staging path for the geometry load job (default matches the
# project's allowed scratch prefix; included here so the wiring is
# visible).
staging_uri = "gs://impactlab-data-scratch/scadavidsanchez/climate-and-damages-aggregation/staging/"
# False: delete the temp geometry table in finally. Set true to skip the
# upload on identical-input re-runs (table expiration is the backstop).
cache_temp_tables = false

[output]
dir = "../../data/out/bigquery_s51_test"
format = "parquet"
