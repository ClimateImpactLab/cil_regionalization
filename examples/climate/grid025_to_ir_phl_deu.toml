# 0.25 degree grid to impact region weights, the Philippines and Germany.
#
# Intensive weights (per_destination): each impact region's shares of
# the grid cells it overlaps add up to one, for averaging a per-cell
# field over the region. Population weights fall back to area for a
# region with no population. prepare_data.py runs this config and
# writes the result under data/weights/, where the notebook reads it.
#
# The shapefile is global; regions.keep limits the targets to the two
# countries by the shapefile's ISO column, which equals the first three
# letters of every hierid (200 regions in PHL, 200 in DEU).
#
# The global version of this config is not kept here.

normalization = "per_destination"

[project]
name = "grid025_ir_phl_deu_per_destination"
description = "0.25 degree grid to world-combo-201710 impact region population weights for intensive climate aggregation, the Philippines and Germany; grid identity grid-0.25deg-center-[-180,180)"

[regions]
# The impact region shapefile, published at 10.5281/zenodo.21934131.
# The path is the cluster location; replace it with the path to your
# copy.
path = "/project/cil/gcp/regions/world-combo-201710/agglomerated-world-new.shp"
id_fields = ["hierid"]
version = "world-combo-201710"
on_invalid_geometry = "repair"

[regions.keep]
ISO = ["PHL", "DEU"]

[grid]
mode = "generate"
resolution = 0.25
offset = "center"
lon_convention = "[-180,180)"

[[weights]]
name = "pop"
# GPW v4 rev 10 population raster (2015, 30 arc second), adjusted to
# UN World Population Prospects; the same raster as
# examples/gadm20/ir_to_adm1_full.toml. The path is the cluster
# location; replace it with the path to your copy.
raster = "/project/cil/gcp/social/population/gpw_v4r10_unwpp_2015/raster_geotiff/gpw_v4r10_unwpp_2015_30ss.tif"
fallback = "area"

[[weights]]
name = "area"

[backend]
kind = "local"
coverage = "exact_fraction"

[output]
dir = "data/weights/grid025_ir_phl_deu_per_destination"
format = "parquet"

[validation]
sum_tolerance = 1e-6
